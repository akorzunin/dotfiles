# yaml-language-server: $schema=https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json

console_title_template: "{{if .Root}} ⚡ {{end}}{{.Folder | replace \"~\" \"🏠\"}}\n@ {{.HostName}}"
blocks:
  - type: prompt
    alignment: left
    segments:
      - properties:
          cache_duration: none
        leading_diamond: 
        trailing_diamond: 
        template: " {{ .Icon }} "
        foreground: "#FFFFFF"
        background: "#172554"
        type: os
        style: diamond
      - properties:
          cache_duration: none
        leading_diamond: "<transparent,#DE2121>\ue0b0</>"
        trailing_diamond: 
        template: " \uf0e7 "
        foreground: "#FFFFFF"
        background: "#DE2121"
        type: root
        style: diamond
      - properties:
          cache_duration: none
          folder_icon: ...
          folder_separator_icon: <transparent>  </>
          home_icon: 
          style: agnoster_short
        leading_diamond: "<transparent,#1e40af>\ue0b0</>"
        trailing_diamond: 
        template: " {{ .Path }} "
        foreground: "#172554"
        background: "#1e40af"
        type: path
        style: diamond
      - properties:
          cache_duration: none
          fetch_stash_count: true
          fetch_status: true
          fetch_upstream_icon: true
        template: " {{ .UpstreamIcon }}{{ .HEAD }}{{ if .Staging.Changed }} \uf046 {{ .Staging.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Working.Changed }} \uf044 {{ .Working.String }}{{ end }}{{ if gt .StashCount 0 }} \ueb4b {{ .StashCount }}{{ end }} "
        foreground: "#FFFFFF"
        powerline_symbol: 
        background: "#15803d"
        type: git
        style: powerline
        background_templates:
          - "{{ if or (.Working.Changed) (.Staging.Changed) }}#ca8a04{{ end }}"
          - "{{ if and (gt .Ahead 0) (gt .Behind 0) }}#ca8a04{{ end }}"
          - "{{ if gt .Ahead 0 }}#ca8a04{{ end }}"
          - "{{ if gt .Behind 0 }}#ca8a04{{ end }}"
  - type: rprompt
    segments:
      - properties:
          cache_duration: none
        leading_diamond: <background,transparent></>
        trailing_diamond: <transparent,background></>
        template: " {{ reason .Code }} "
        foreground: "#ffffff"
        background: "#910000"
        type: status
        style: diamond
      - properties:
          cache_duration: none
          style: dallas
          threshold: 0
        leading_diamond: "<#1e40af,transparent>\ue0b2</>"
        template: " {{ .FormattedMs }}s "
        foreground: "#172554"
        background: "#1e40af"
        type: executiontime
        style: diamond
version: 3
final_space: true
