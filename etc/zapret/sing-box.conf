[Unit]
Description=zapret DPI bypass (Discord and YouTube, ISP-tested)

[Service]
# sing-box's catch-all policy route would otherwise send generated packets to TUN.
ExecStartPre=/usr/bin/ip rule add priority 101 fwmark 0x40000000/0x40000000 lookup main
ExecStopPost=-/usr/bin/ip rule del priority 101 fwmark 0x40000000/0x40000000 lookup main
